[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inboxready"
version = "0.1.0"
description = "Score an email draft before you send it: subject length and caps, spam trigger phrases, link count, risky or phantom attachments, HTML-only MIME shape."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "InboxReady" }]
keywords = ["email", "deliverability", "spam", "eml", "cold-email", "smtp", "copy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email",
  "Environment :: Console",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
inboxready = "inboxready.cli:main"

[tool.setuptools.packages.find]
include = ["inboxready*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
